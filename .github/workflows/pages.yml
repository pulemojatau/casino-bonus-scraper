# Builds the page from the committed data/casinos.json and publishes it to
# GitHub Pages. The scrape itself runs locally (it needs an API key and is
# deliberately not hammering the source from CI on every push).
name: Deploy page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_data: ${{ steps.data.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check for scraped data
        id: data
        run: |
          if [ -f data/casinos.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No data/casinos.json yet. Run 'npm run scrape' locally and push it; skipping deploy."
          fi
      - if: steps.data.outputs.exists == 'true'
        run: npm run build
      - if: steps.data.outputs.exists == 'true'
        uses: actions/configure-pages@v5
      - if: steps.data.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.has_data == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
